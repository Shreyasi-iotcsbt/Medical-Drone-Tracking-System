<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Drone Tracker — 3D Preview</title>
<style>
body{margin:0;background:#070b17;color:#eef5ff;font-family:Segoe UI,Arial,sans-serif}
header{padding:16px 20px;background:#111a2d;border-bottom:1px solid #293a59}
h1{font-size:20px;margin:0 0 5px}.sub{color:#a8b8d3;font-size:13px}
#scene{height:76vh;width:100%;display:block}
.controls{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
button{background:#1c3151;color:white;border:1px solid #45618b;border-radius:8px;padding:10px 14px;cursor:pointer}
.note{padding:0 20px 18px;color:#a8b8d3;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<header><h1>Medical Drone Tracker — 3D Preview</h1><div class="sub">Conceptual 3D visualization · simulated route only</div></header>
<canvas id="scene"></canvas>
<div class="controls">
<button id="play">▶ Play route</button><button id="reset">↻ Reset</button>
<a href="index.html" style="color:#9dd5ff;align-self:center;margin-left:8px">← Back to 2D map</a>
</div>
<div class="note">This is a lightweight visual preview, not a physics simulator and not connected to a real drone. Internet access is required to load Three.js from its CDN.</div>
<script type="module">
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b17);
scene.fog=new THREE.Fog(0x070b17,18,65);
const camera=new THREE.PerspectiveCamera(55,1,0.1,100);
camera.position.set(0,12,24);
scene.add(new THREE.HemisphereLight(0x9fcaff,0x17203a,2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,10,8);scene.add(light);
const grid=new THREE.GridHelper(40,40,0x245079,0x162846);scene.add(grid);
const pts=[
 new THREE.Vector3(-14,1,9),new THREE.Vector3(-5,2,3),
 new THREE.Vector3(4,3,-3),new THREE.Vector3(14,2,-9)
];
const routeGeom=new THREE.BufferGeometry().setFromPoints(pts);
scene.add(new THREE.Line(routeGeom,new THREE.LineBasicMaterial({color:0x36c6f0})));
const labels=[];
pts.forEach((p,i)=>{
 const marker=new THREE.Mesh(new THREE.SphereGeometry(.45,20,16),new THREE.MeshStandardMaterial({color:i===0?0x21c58b:(i===3?0xffba57:0x517cff),emissive:i===0?0x063d2c:0x07142f}));
 marker.position.copy(p);scene.add(marker);
 const spriteCanvas=document.createElement('canvas');spriteCanvas.width=256;spriteCanvas.height=80;
 const ctx=spriteCanvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.font='bold 42px Arial';ctx.fillText(['A · Dum Dum Hospital','B · Chinar Park','C · Sector V','D · Garia Hospital'][i],8,52);
 const tex=new THREE.CanvasTexture(spriteCanvas);const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
 spr.position.set(p.x,p.y+1.5,p.z);spr.scale.set(4,1.25,1);scene.add(spr);labels.push(spr);
});
const drone=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,.35,.8),new THREE.MeshStandardMaterial({color:0xff4bd8,metalness:.35,roughness:.35}));drone.add(body);
for(const [x,z] of [[-.9,-.65],[-.9,.65],[.9,-.65],[.9,.65]]){
 const arm=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,1.1),new THREE.MeshStandardMaterial({color:0xd9e5ff}));
 arm.rotation.z=Math.PI/2;arm.position.set(x*.45,0,z*.4);drone.add(arm);
 const rotor=new THREE.Mesh(new THREE.TorusGeometry(.35,.035,8,24),new THREE.MeshStandardMaterial({color:0x36c6f0}));
 rotor.rotation.x=Math.PI/2;rotor.position.set(x,0,z);drone.add(rotor);
}
scene.add(drone);
let progress=0,playing=false,last=0;
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Ⅱ Pause':'▶ Play route'};
document.querySelector('#reset').onclick=()=>{progress=0;playing=false;drone.position.copy(pts[0]);document.querySelector('#play').textContent='▶ Play route'};
function animate(t){
 requestAnimationFrame(animate);
 if(playing)progress+=.0018;
 // Complete A->B->C->D then D->C->B->A.
 const full=[...pts,...pts.slice(0,3).reverse()];
 const total=full.length-1;const p=Math.min(progress,1)*total;
 const i=Math.min(Math.floor(p),total-1),f=p-i;
 drone.position.lerpVectors(full[i],full[i+1],f);
 drone.position.y+=Math.sin(t*.004)*.12;
 if(progress>=1){progress=0;playing=false;document.querySelector('#play').textContent='▶ Play route'}
 camera.lookAt(0,0,0);renderer.render(scene,camera);
}
drone.position.copy(pts[0]);requestAnimationFrame(animate);
</script>
</body></html>
